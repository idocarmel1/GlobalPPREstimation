<div class="section-title">PPR estimation</div>
<div class="field"><label for="metricMode">Color ecosystems by</label><select id="metricMode">
  <option value="ppr">PPR estimate</option><option value="ratio">Ratio of two methods</option>
  <option value="b">Recycling · b</option><option value="rho_living">Recycling · rho living</option>
</select></div>
<div id="pprOptions">
  <div class="field"><label for="scopeFilter">SPPR source scope</label><select id="scopeFilter">
    <option value="all">All · includes imports</option><option value="inner">Inner · excludes imports</option>
    <option value="PP">PP · primary producers only</option>
  </select></div>
  <div class="field"><label for="methodFilter" id="methodLabel">Estimation method</label><select id="methodFilter"></select></div>
  <div class="field" id="denominatorField" hidden><label for="denominatorFilter">Divide by method</label><select id="denominatorFilter"></select></div>
</div>
<div class="field" id="recyclingOptions" hidden><label for="teFilter">SPPR_new transfer efficiency</label><select id="teFilter"><option value="GE">GE</option><option value="TE">TE · EE repair enabled</option></select></div>
<p id="metricHelp" class="network-note"></p>
<div class="legend-card" id="networkLegend"><b id="metricLegendTitle">PPR estimate</b><div class="grad" id="metricGradient"></div><div class="legend-labels"><span id="metricLow"></span><span id="metricMiddle"></span><span id="metricHigh"></span></div></div>
<p class="network-note">Color is limited to the 10 selected-article pilot ecosystems. Gray means unselected or unavailable. Select an ecosystem to inspect its model, catch coverage and scientific limits.</p>
